[project]
name = "northwind-rag"
version = "1.0.0"
description = "RAG with LangGraph + Chroma, layered guardrails (incl. streaming) and LangSmith evaluation"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aleksandar Marinov" }]
dependencies = [
    "langgraph>=1.0",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langchain-chroma>=1.0",
    "langchain-text-splitters>=1.0",
    "chromadb>=1.0",
    "langsmith>=0.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "redis>=5.0",
    "elasticsearch>=8.15,<9",  # keep the major in step with the server (8.x)
    "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "fakeredis[lua]>=2.20"]
anthropic = ["langchain-anthropic>=1.0"]

[project.scripts]
northwind-rag = "northwind_rag.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
northwind_rag = ["migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
