apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: northwind-rag
labels:
  - pairs: {app.kubernetes.io/part-of: northwind-rag}
    includeSelectors: false
resources:
  - namespace.yaml
  - redis.yaml
  - chroma.yaml
  - elasticsearch.yaml
  - postgres.yaml
  - database-jobs.yaml
  - api.yaml
  - ingest.yaml
  - networkpolicy.yaml
  - istio.yaml
configMapGenerator:
  - name: rag-config
    behavior: create
    envs: [config.env]
images:
  - name: northwind-rag
    newName: registry.northwind.example/northwind-rag
    newTag: "1.0.0"
