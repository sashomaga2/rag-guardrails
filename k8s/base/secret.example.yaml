# Template only: NOT listed in kustomization.yaml, never commit real values.
# Create the secret out of band:
#   kubectl -n northwind-rag create secret generic rag-secrets \
#     --from-literal=OPENAI_API_KEY=... --from-literal=LANGSMITH_API_KEY=... \
#     --from-literal=RAG_AGENT_WEBHOOK_SECRET=$(openssl rand -hex 32) \
#     --from-literal=POSTGRES_PASSWORD=$PGPASS \
#     --from-literal=RAG_DATABASE_URL=postgresql://northwind:$PGPASS@postgres:5432/northwind
# or sync it from Vault (External Secrets Operator, or Vault Agent Injector with AppRole).
apiVersion: v1
kind: Secret
metadata:
  name: rag-secrets
  namespace: northwind-rag
type: Opaque
stringData:
  OPENAI_API_KEY: replace-me
  LANGSMITH_API_KEY: replace-me
  RAG_AGENT_WEBHOOK_SECRET: replace-me  # HMAC key shared with the support desk
  POSTGRES_PASSWORD: replace-me
  RAG_DATABASE_URL: postgresql://northwind:replace-me@postgres:5432/northwind
  # RAG_ELASTICSEARCH_API_KEY: replace-me  # when Elasticsearch runs with security (ECK / Elastic Cloud)
